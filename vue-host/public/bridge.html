<!DOCTYPE html>
<html>
<head>
    <title>MFE Storage Bridge</title>
</head>
<body>
    <script>
        const channel = new BroadcastChannel('mfe-bus');

        // relay broadcasts from other tabs to this tab's parent
        channel.onmessage = (event) => {
            window.parent.postMessage({ type: 'BROADCAST_RECEIVE', ...event.data }, '*');
        };

        window.addEventListener('message', (event) => {
            const allowedOrigins = [
                'http://localhost:5173',
                'http://localhost:5001',
                'http://localhost:5002',
                'http://localhost:5003',
                'http://localhost:5004',
            ];
            if (!allowedOrigins.includes(event.origin)) return;

            const { type, key, value, requestId } = event.data;

            switch (type) {
                case 'GET_ITEM': {
                    const item = localStorage.getItem(key);
                    event.source.postMessage({ type: 'RESPONSE', requestId, value: item }, event.origin);
                    break;
                }
                case 'SET_ITEM': {
                    localStorage.setItem(key, value);
                    event.source.postMessage({ type: 'RESPONSE', requestId }, event.origin);
                    break;
                }
                case 'REMOVE_ITEM': {
                    localStorage.removeItem(key);
                    event.source.postMessage({ type: 'RESPONSE', requestId }, event.origin);
                    break;
                }
                case 'BROADCAST_SEND': {
                    channel.postMessage({ eventName: event.data.eventName, detail: event.data.detail });
                    window.parent.postMessage({ type: 'BROADCAST_RECEIVE', eventName: event.data.eventName, detail: event.data.detail }, '*');
                    break;
                }
            }
        });

        // 50ms delay: iframe script can fire before parent registers its listener
        setTimeout(() => {
            window.parent.postMessage({ type: 'BRIDGE_READY' }, '*');
        }, 50);
    </script>
</body>
</html>
